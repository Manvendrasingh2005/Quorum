name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-mock
        
    - name: Run pytest
      env:
        # We dummy out API keys for the pytest run since tests should be mocked and not hit live APIs.
        GEMINI_API_KEY: "dummy_test_key"
        TAVILY_API_KEY: "dummy_test_key"
        PYTHONPATH: "."
      run: |
        # Run tests excluding integration/live folders if any exist, just root level tests for now.
        pytest tests/ -v
